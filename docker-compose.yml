version: '3.8'

services:
  # PassKeeper Vault Node.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passkeeper-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://myapp:arial123@192.168.1.40:5432/my_app_db?schema=public}
      - JWT_SECRET=${JWT_SECRET:-99434b7109d79ec784b27e242622bf6e43f3d8f2e43277fae948ed5727d0934a}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-4f8a2b9c7d1e3f6a8b0c2d4e6f8a0b2c}

  # Cloudflare Tunnel for Secure Internet Access (Zero Open Ports)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: passkeeper-tunnel
    restart: unless-stopped
    depends_on:
      - app
    # Named Tunnel Mode (permanent custom domain via Cloudflare Zero Trust Dashboard):
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # Quick Tunnel Mode (zero config, generates free *.trycloudflare.com URL) — commented out:
    # command: tunnel --no-autoupdate --url http://app:3000
