<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vault Dashboard - PassKeeper</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/js/lucide.min.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <i data-lucide="shield-check" class="icon-md"></i>
        </div>
        <div>
          <div class="brand-title">PassKeeper</div>
          <div style="font-size: 0.8125rem; color: var(--muted-foreground);">
            Welcome back, <span id="user-name-display" style="color: var(--foreground); font-weight:600;">User</span>
          </div>
        </div>
      </div>
      
      <!-- Primary Action: Open Add New Entry Dialog -->
      <button id="open-add-modal-btn" class="btn btn-primary">
        <i data-lucide="plus" class="icon-sm"></i>
        <span>Add New Entry</span>
      </button>
    </header>

    <!-- Summary Metric Cards (shadcn Style) -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem;">
      <div class="card" style="padding: 0.875rem 1rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; color: var(--muted-foreground); margin-bottom: 0.25rem;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">Total Secrets</span>
          <i data-lucide="shield" class="icon-sm"></i>
        </div>
        <div id="metric-total" style="font-size: 1.5rem; font-weight: 700; color: var(--foreground);">0</div>
      </div>

      <div class="card" style="padding: 0.875rem 1rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; color: var(--muted-foreground); margin-bottom: 0.25rem;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">DB Strings</span>
          <i data-lucide="database" class="icon-sm"></i>
        </div>
        <div id="metric-db" style="font-size: 1.5rem; font-weight: 700; color: var(--foreground);">0</div>
      </div>

      <div class="card" style="padding: 0.875rem 1rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; color: var(--muted-foreground); margin-bottom: 0.25rem;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">Passwords</span>
          <i data-lucide="key-round" class="icon-sm"></i>
        </div>
        <div id="metric-passwords" style="font-size: 1.5rem; font-weight: 700; color: var(--foreground);">0</div>
      </div>

      <div class="card" style="padding: 0.875rem 1rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; color: var(--muted-foreground); margin-bottom: 0.25rem;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">Guides / Steps</span>
          <i data-lucide="book-open" class="icon-sm"></i>
        </div>
        <div id="metric-steps" style="font-size: 1.5rem; font-weight: 700; color: var(--foreground);">0</div>
      </div>
    </div>

    <!-- Search Bar with Shortcut Hint -->
    <div class="form-group" style="margin-bottom: 0.875rem;">
      <div class="input-wrapper">
        <i data-lucide="search" class="icon-sm" style="position: absolute; left: 0.75rem; color: var(--muted-foreground); pointer-events: none;"></i>
        <input type="text" id="search-input" class="form-input" placeholder="Search passwords, connection strings, hosts, guides, tags..." style="padding-left: 2.25rem; padding-right: 2.5rem;">
        <span style="position: absolute; right: 0.625rem; font-size: 0.6875rem; font-weight: 600; background: var(--secondary); border: 1px solid var(--border); padding: 0.125rem 0.375rem; border-radius: var(--radius-sm); color: var(--muted-foreground); font-family: var(--font-mono);">/</span>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="category-pills">
      <button class="pill active" data-cat="ALL">
        <i data-lucide="layers" class="icon-xs"></i>
        <span>All Items</span>
      </button>
      <button class="pill" data-cat="DB_CONNECTION">
        <i data-lucide="database" class="icon-xs"></i>
        <span>Connection Strings</span>
      </button>
      <button class="pill" data-cat="PASSWORD">
        <i data-lucide="key-round" class="icon-xs"></i>
        <span>Passwords</span>
      </button>
      <button class="pill" data-cat="STEP_BY_STEP">
        <i data-lucide="book-open" class="icon-xs"></i>
        <span>Step-by-Step</span>
      </button>
      <button class="pill" data-cat="API_KEY">
        <i data-lucide="zap" class="icon-xs"></i>
        <span>API Keys</span>
      </button>
      <button class="pill" data-cat="SSH_KEY">
        <i data-lucide="terminal" class="icon-xs"></i>
        <span>SSH Keys</span>
      </button>
    </div>

    <!-- Secrets List Container -->
    <main id="secret-list" class="secret-list">
      <!-- Rendered dynamically by dashboard.js -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="/dashboard" class="nav-item active">
        <i data-lucide="layout-dashboard" class="icon-md"></i>
        <span>Vault</span>
      </a>

      <button id="mobile-add-btn" class="nav-item" style="background:none; border:none; cursor:pointer;" onclick="openAddModal()">
        <i data-lucide="plus-circle" class="icon-md"></i>
        <span>Add</span>
      </button>

      <a href="/settings" class="nav-item">
        <i data-lucide="settings" class="icon-md"></i>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- ======================================================
       ADD / EDIT SECRET DIALOG MODAL OVERLAY (shadcn Dialog)
       ====================================================== -->
  <div id="add-secret-modal" class="modal-overlay">
    <div class="modal-dialog">
      
      <div class="modal-header">
        <h2 id="modal-header-title" style="font-size: 1.125rem; font-weight: 600; color: var(--foreground); display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="plus" class="icon-sm"></i>
          <span>Add New Entry</span>
        </h2>
        <button id="close-modal-btn" class="modal-close-btn" aria-label="Close Dialog">
          <i data-lucide="x" class="icon-sm"></i>
        </button>
      </div>

      <form id="modal-add-form">
        
        <div class="form-group">
          <label class="form-label" for="modal-category">Secret Type</label>
          <select id="modal-category" class="form-select">
            <option value="PASSWORD">Password Credential</option>
            <option value="DB_CONNECTION">Database Connection String</option>
            <option value="STEP_BY_STEP">Step-by-Step Explanation</option>
            <option value="API_KEY">API Key / Token</option>
            <option value="SSH_KEY">SSH Key / Private Certificate</option>
            <option value="OTHER">General Note / Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-title">Title / Name</label>
          <input type="text" id="modal-title" class="form-input" placeholder="e.g. Proxmox Server Setup Procedure" required>
        </div>

        <!-- Password Specific Fields -->
        <div id="modal-cat-password-fields">
          <div class="form-group">
            <label class="form-label" for="modal-username">Username / Email</label>
            <input type="text" id="modal-username" class="form-input" placeholder="user@example.com">
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem;">
              <label class="form-label" for="modal-secret-password" style="margin-bottom:0;">Password</label>
              <button type="button" id="modal-gen-pass-btn" class="btn btn-secondary" style="padding: 0 0.5rem; height: 1.625rem; font-size: 0.75rem;">
                <i data-lucide="sparkles" class="icon-xs"></i>
                <span>Auto Generate</span>
              </button>
            </div>
            <div class="input-wrapper">
              <input type="password" id="modal-secret-password" class="form-input code-font" placeholder="SuperStrongSecret123!">
              <button type="button" class="input-icon-btn toggle-password-btn">
                <i data-lucide="eye" class="icon-sm"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-websiteUrl">Website URL</label>
            <input type="url" id="modal-websiteUrl" class="form-input" placeholder="https://app.example.com">
          </div>
        </div>

        <!-- DB Connection String Specific Fields -->
        <div id="modal-cat-db-fields" style="display:none;">
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem;">
              <label class="form-label" for="modal-db-conn-string" style="margin-bottom:0;">Full Connection URI</label>
              <button type="button" id="modal-parse-conn-btn" class="btn btn-secondary" style="padding: 0 0.5rem; height: 1.625rem; font-size: 0.75rem;">
                <i data-lucide="cpu" class="icon-xs"></i>
                <span>Auto Parse URI</span>
              </button>
            </div>
            <input type="text" id="modal-db-conn-string" class="form-input code-font" placeholder="postgresql://postgres:pass@db.example.com:5432/my_database">
          </div>

          <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 0.5rem;">
            <div class="form-group">
              <label class="form-label" for="modal-db-host">Host</label>
              <input type="text" id="modal-db-host" class="form-input code-font" placeholder="db.example.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="modal-db-port">Port</label>
              <input type="text" id="modal-db-port" class="form-input code-font" placeholder="5432">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <div class="form-group">
              <label class="form-label" for="modal-db-user">DB User</label>
              <input type="text" id="modal-db-user" class="form-input code-font" placeholder="postgres">
            </div>
            <div class="form-group">
              <label class="form-label" for="modal-db-pass">DB Password</label>
              <input type="password" id="modal-db-pass" class="form-input code-font" placeholder="••••••••">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-db-name">Database Name</label>
            <input type="text" id="modal-db-name" class="form-input code-font" placeholder="production_db">
          </div>
        </div>

        <!-- Dynamic Step-by-Step Builder Fields -->
        <div id="modal-cat-steps-fields" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
            <label class="form-label" style="margin-bottom:0;">Procedure Steps</label>
            <button type="button" id="modal-add-step-btn" class="btn btn-secondary" style="padding: 0 0.625rem; height: 1.75rem; font-size: 0.75rem;">
              <i data-lucide="plus" class="icon-xs"></i>
              <span>Add Another Step</span>
            </button>
          </div>
          <div id="modal-steps-container" style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1rem;">
            <!-- Dynamic step rows inserted here -->
          </div>
        </div>

        <!-- API / SSH Fields -->
        <div id="modal-cat-api-fields" style="display:none;">
          <div class="form-group">
            <label class="form-label" for="modal-api-key-val">Key / Token Content</label>
            <textarea id="modal-api-key-val" class="form-textarea code-font" rows="3" placeholder="Paste secret key or private certificate content here..."></textarea>
          </div>
        </div>

        <!-- Common Notes & Tags -->
        <div class="form-group">
          <label class="form-label" for="modal-notes">Encrypted Notes</label>
          <textarea id="modal-notes" class="form-textarea" rows="2" placeholder="Optional extra instructions, recovery codes..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-tags">Tags (Comma separated)</label>
          <input type="text" id="modal-tags" class="form-input" placeholder="proxmox, deployment, guide">
        </div>

        <div style="display:flex; align-items:center; gap:0.625rem; margin-bottom: 1.25rem;">
          <input type="checkbox" id="modal-favorite" style="width: 1rem; height: 1rem; accent-color: var(--primary); border-radius: var(--radius-sm);">
          <label for="modal-favorite" style="font-size: 0.875rem; font-weight: 500; color: var(--foreground); cursor: pointer; display: flex; align-items: center; gap: 0.375rem;">
            <i data-lucide="star" class="icon-xs"></i>
            <span>Add to Favorites</span>
          </label>
        </div>

        <div style="display:flex; justify-content:flex-end; gap: 0.5rem;">
          <button type="button" id="cancel-modal-btn" class="btn btn-outline">Cancel</button>
          <button type="submit" id="modal-submit-btn" class="btn btn-primary">Encrypt & Save</button>
        </div>

      </form>

    </div>
  </div>

  <!-- ======================================================
       RIGHT SLIDE-OVER DRAWER PANEL (shadcn Sheet)
       ====================================================== -->
  <div id="step-drawer-overlay" class="drawer-overlay">
    <div class="drawer-panel">
      
      <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:1.25rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
        <div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <i data-lucide="book-open" class="icon-md"></i>
            <h2 id="drawer-title" style="font-size:1.125rem; font-weight:700; color:var(--foreground);">Guide Title</h2>
          </div>
          <div id="drawer-subtitle" style="font-size:0.8125rem; color:var(--muted-foreground); margin-top:0.25rem;">Procedure Steps</div>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <button id="drawer-edit-btn" class="btn btn-outline" style="height:2rem; font-size:0.75rem;">
            <i data-lucide="pencil" class="icon-xs"></i>
            <span>Edit</span>
          </button>
          <button id="close-drawer-btn" class="modal-close-btn" aria-label="Close Drawer">
            <i data-lucide="x" class="icon-sm"></i>
          </button>
        </div>
      </div>

      <!-- Steps Timeline Container -->
      <div id="drawer-steps-list" style="display:flex; flex-direction:column; gap:1rem; flex:1;">
        <!-- Rendered dynamically by dashboard.js -->
      </div>

      <div style="margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem; display:flex; justify-content:space-between; align-items:center;">
        <button id="drawer-edit-footer-btn" class="btn btn-outline">
          <i data-lucide="pencil" class="icon-xs"></i>
          <span>Edit Guide</span>
        </button>
        <button id="close-drawer-footer-btn" class="btn btn-secondary">Close</button>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
