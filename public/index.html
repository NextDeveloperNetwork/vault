<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vault Dashboard - PassKeeper</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Professional Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">🔐</div>
        <div>
          <div class="brand-title">PassKeeper</div>
          <div style="font-size: 0.8rem; color: #64748b;">
            Welcome back, <span id="user-name-display" style="color: #4f46e5; font-weight:800;">User</span>
          </div>
        </div>
      </div>
      
      <!-- Primary Action: Open Add New Entry Dialog -->
      <button id="open-add-modal-btn" class="btn btn-primary" style="padding: 10px 18px; font-size: 0.9rem; min-height: 42px; gap: 6px;">
        <span style="font-size: 1.1rem; font-weight: 800;">+</span> Add New Entry
      </button>
    </header>

    <!-- Professional Summary Metric Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="glass-card" style="padding: 14px 16px; border-radius: 16px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Total Secrets</div>
        <div id="metric-total" style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 2px;">0</div>
      </div>

      <div class="glass-card" style="padding: 14px 16px; border-radius: 16px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #059669; text-transform: uppercase;">DB Strings</div>
        <div id="metric-db" style="font-size: 1.5rem; font-weight: 800; color: #059669; margin-top: 2px;">0</div>
      </div>

      <div class="glass-card" style="padding: 14px 16px; border-radius: 16px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #2563eb; text-transform: uppercase;">Passwords</div>
        <div id="metric-passwords" style="font-size: 1.5rem; font-weight: 800; color: #2563eb; margin-top: 2px;">0</div>
      </div>

      <div class="glass-card" style="padding: 14px 16px; border-radius: 16px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #d97706; text-transform: uppercase;">API Keys</div>
        <div id="metric-api" style="font-size: 1.5rem; font-weight: 800; color: #d97706; margin-top: 2px;">0</div>
      </div>
    </div>

    <!-- Search Bar with Shortcut Hint -->
    <div class="form-group" style="margin-bottom: 14px;">
      <div class="input-wrapper">
        <input type="text" id="search-input" class="form-input" placeholder="🔍 Search passwords, connection strings, hosts, tags..." style="padding-left: 16px; padding-right: 44px; border-radius: 16px;">
        <span style="position: absolute; right: 14px; font-size: 0.75rem; font-weight: 700; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 2px 6px; border-radius: 6px; color: #64748b;">/</span>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="category-pills">
      <button class="pill active" data-cat="ALL">All Items</button>
      <button class="pill" data-cat="DB_CONNECTION">🗄️ Connection Strings</button>
      <button class="pill" data-cat="PASSWORD">🔑 Passwords</button>
      <button class="pill" data-cat="API_KEY">⚡ API Keys</button>
      <button class="pill" data-cat="SSH_KEY">💻 SSH Keys</button>
    </div>

    <!-- Secrets List Container -->
    <main id="secret-list" class="secret-list">
      <!-- Rendered dynamically by dashboard.js -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="/dashboard" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Vault</span>
      </a>

      <button id="mobile-add-btn" class="nav-item" style="background:none; border:none; cursor:pointer;" onclick="openAddModal()">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>+ Add</span>
      </button>

      <a href="/settings" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- ======================================================
       ADD NEW SECRET / ENTRY MODAL DIALOG OVERLAY
       ====================================================== -->
  <div id="add-secret-modal" class="modal-overlay">
    <div class="modal-dialog">
      
      <div class="modal-header">
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px;">
          <span>➕</span> Add New Secret Entry
        </h2>
        <button id="close-modal-btn" class="modal-close-btn" aria-label="Close Dialog">✕</button>
      </div>

      <form id="modal-add-form">
        
        <div class="form-group">
          <label class="form-label" for="modal-category">Secret Type</label>
          <select id="modal-category" class="form-select" style="background: #ffffff; color: #0f172a; border: 1.5px solid #cbd5e1;">
            <option value="PASSWORD">🔑 Password Credential</option>
            <option value="DB_CONNECTION">🗄️ Database Connection String</option>
            <option value="API_KEY">⚡ API Key / Token</option>
            <option value="SSH_KEY">💻 SSH Key / Private Certificate</option>
            <option value="OTHER">📦 General Note / Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-title">Title / Name</label>
          <input type="text" id="modal-title" class="form-input" placeholder="e.g. Production Postgres DB or GitHub Account" required>
        </div>

        <!-- Password Specific Fields -->
        <div id="modal-cat-password-fields">
          <div class="form-group">
            <label class="form-label" for="modal-username">Username / Email</label>
            <input type="text" id="modal-username" class="form-input" placeholder="user@example.com">
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label class="form-label" for="modal-secret-password" style="margin-bottom:0;">Password</label>
              <button type="button" id="modal-gen-pass-btn" class="btn-secondary" style="padding: 4px 10px; min-height: 28px; font-size: 0.75rem;">
                ⚡ Auto Generate
              </button>
            </div>
            <div class="input-wrapper">
              <input type="password" id="modal-secret-password" class="form-input code-font" placeholder="SuperStrongSecret123!">
              <button type="button" class="input-icon-btn toggle-password-btn">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-websiteUrl">Website URL</label>
            <input type="url" id="modal-websiteUrl" class="form-input" placeholder="https://app.example.com">
          </div>
        </div>

        <!-- DB Connection String Specific Fields -->
        <div id="modal-cat-db-fields" style="display:none;">
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label class="form-label" for="modal-db-conn-string" style="margin-bottom:0;">Full Connection URI</label>
              <button type="button" id="modal-parse-conn-btn" class="btn-secondary" style="padding: 4px 10px; min-height: 28px; font-size: 0.75rem;">
                🧩 Auto Parse URI
              </button>
            </div>
            <input type="text" id="modal-db-conn-string" class="form-input code-font" placeholder="postgresql://postgres:pass@db.example.com:5432/my_database">
          </div>

          <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 8px;">
            <div class="form-group">
              <label class="form-label" for="modal-db-host">Host</label>
              <input type="text" id="modal-db-host" class="form-input code-font" placeholder="db.example.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="modal-db-port">Port</label>
              <input type="text" id="modal-db-port" class="form-input code-font" placeholder="5432">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group">
              <label class="form-label" for="modal-db-user">DB User</label>
              <input type="text" id="modal-db-user" class="form-input code-font" placeholder="postgres">
            </div>
            <div class="form-group">
              <label class="form-label" for="modal-db-pass">DB Password</label>
              <input type="password" id="modal-db-pass" class="form-input code-font" placeholder="••••••••">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-db-name">Database Name</label>
            <input type="text" id="modal-db-name" class="form-input code-font" placeholder="production_db">
          </div>
        </div>

        <!-- API / SSH Fields -->
        <div id="modal-cat-api-fields" style="display:none;">
          <div class="form-group">
            <label class="form-label" for="modal-api-key-val">Key / Token Content</label>
            <textarea id="modal-api-key-val" class="form-textarea code-font" rows="3" placeholder="Paste secret key or private certificate content here..."></textarea>
          </div>
        </div>

        <!-- Common Notes & Tags -->
        <div class="form-group">
          <label class="form-label" for="modal-notes">Encrypted Notes</label>
          <textarea id="modal-notes" class="form-textarea" rows="2" placeholder="Optional extra instructions, recovery codes..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-tags">Tags (Comma separated)</label>
          <input type="text" id="modal-tags" class="form-input" placeholder="prod, postgres, aws">
        </div>

        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 20px;">
          <input type="checkbox" id="modal-favorite" style="width: 20px; height: 20px; accent-color: var(--accent-primary);">
          <label for="modal-favorite" style="font-size: 0.9rem; font-weight: 700; color: #0f172a; cursor: pointer;">Add to Favorites ⭐</label>
        </div>

        <div style="display:flex; justify-content:flex-end; gap: 10px;">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary" style="min-height: 44px;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="min-height: 44px;">Encrypt & Save 🔒</button>
        </div>

      </form>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
