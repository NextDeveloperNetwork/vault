<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - PassKeeper Vault</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <div class="app-container" style="justify-content: center; padding-bottom: 32px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-logo" style="width: 56px; height: 56px; margin: 0 auto 14px auto; font-size: 1.8rem;">🔐</div>
      <h1 class="brand-title" style="font-size: 1.8rem;">PassKeeper</h1>
      <p style="margin-top: 6px;">Self-Hosted Encrypted Secret Vault</p>
    </div>

    <div class="glass-card" style="padding: 24px;">
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Vault Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="admin@passkeeper.local" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Master Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="input-icon-btn toggle-password-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
          Unlock Vault 🔓
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <p style="font-size: 0.85rem;">Don't have a vault yet?</p>
        <a href="/register" style="color: var(--accent-primary); font-weight: 700; text-decoration: none; font-size: 0.9rem;">
          Create New Vault Account →
        </a>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--text-dim);">
      🔒 End-to-End AES-256-GCM Encrypted | Self-Hosted
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
