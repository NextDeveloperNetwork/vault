<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Create Account â€” PassKeeper Vault</title>
  <meta name="description" content="Create your PassKeeper vault account.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PassKeeper">
  <link rel="icon" type="image/x-icon" href="/favicon.jpg">
  <link rel="shortcut icon" href="/favicon.jpg">
  <link rel="apple-touch-icon" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/variables.css?v=5">
  <link rel="stylesheet" href="/css/global.css?v=5">
  <link rel="stylesheet" href="/css/mobile.css?v=5">
  <script src="/js/lucide.min.js?v=5"></script>
  <script>
    // Instant redirect if active approved session exists
    fetch('/api/auth/me', { credentials: 'include' })
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.user && data.user.status === 'APPROVED') {
          window.location.replace('/dashboard');
        }
      })
      .catch(() => {});
  </script>
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    
    <!-- Clean Brand Header -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="auth-brand-logo">
        <i data-lucide="shield-check" class="icon-lg"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;">Create Vault</h1>
      <p style="margin-top: 0.25rem; font-size: 0.875rem; color: var(--muted-foreground);">Set up your self-hosted master credentials</p>
    </div>

    <!-- shadcn Auth Card Container -->
    <div class="auth-card">
      
      <div style="margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--foreground);">Registration</h2>
        <p style="font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 0.25rem;">
          First user becomes Admin. Subsequent accounts require quick admin approval.
        </p>
      </div>

      <form id="register-form">
        
        <div class="form-group">
          <label class="form-label" for="name">Your Name / Alias</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Alex Rivera" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Vault Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@passkeeper.local" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Master Password</label>
            <span id="password-strength-text" style="font-size: 0.75rem; font-weight: 600; color: var(--muted-foreground);">Min 8 chars</span>
          </div>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required autocomplete="new-password">
            <button type="button" class="input-icon-btn toggle-password-btn" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="icon-sm"></i>
            </button>
          </div>
          <!-- Password Strength Bar -->
          <div style="height: 4px; background: var(--secondary); border-radius: 9999px; margin-top: 0.5rem; overflow: hidden;">
            <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);"></div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="confirmPassword">Confirm Master Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 2.5rem; font-size: 0.9375rem;">
          <i data-lucide="key-round" class="icon-xs"></i>
          <span>Create Vault Account</span>
        </button>

      </form>

      <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
        <p style="font-size: 0.8125rem; color: var(--muted-foreground);">Already have a vault?</p>
        <a href="/login" style="display: inline-block; margin-top: 0.25rem; font-size: 0.875rem; color: var(--foreground); font-weight: 600; text-decoration: underline;">
          â† Return to Login
        </a>
      </div>
    </div>

    <!-- Security Footer -->
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; gap: 0.375rem;">
      <i data-lucide="lock" class="icon-xs"></i>
      <span>Multi-Tenant Role-Based Access Control â€¢ Self-Hosted</span>
    </div>

  </div>

  <script src="/js/api.js?v=5"></script>
  <script src="/js/auth.js?v=5"></script>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
