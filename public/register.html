<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Account - PassKeeper Vault</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script>
    // Instant redirect if active approved session exists
    fetch('/api/auth/me', { credentials: 'include' })
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.user && data.user.status === 'APPROVED') {
          window.location.replace('/dashboard');
        }
      })
      .catch(() => {});
  </script>
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    
    <!-- Clean Brand Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="auth-brand-logo">🛡️</div>
      <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; letter-spacing: -0.03em;">Create Vault</h1>
      <p style="margin-top: 4px; font-size: 0.95rem; color: #64748b;">Set up your self-hosted master credentials</p>
    </div>

    <!-- Pristine White Auth Card Container -->
    <div class="auth-card">
      
      <div style="margin-bottom: 20px;">
        <h2 style="font-size: 1.35rem; font-weight: 800; color: #0f172a;">Registration</h2>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">
          First user becomes Admin. Subsequent accounts require quick admin approval.
        </p>
      </div>

      <form id="register-form">
        
        <div class="form-group">
          <label class="form-label" for="name">Your Name / Alias</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Alex Rivera" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Vault Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@passkeeper.local" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Master Password</label>
            <span id="password-strength-text" style="font-size: 0.75rem; font-weight: 700; color: #94a3b8;">Min 8 chars</span>
          </div>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="new-password">
            <button type="button" class="input-icon-btn toggle-password-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
          <!-- Clear Strength Meter Bar -->
          <div style="height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: 8px; overflow: hidden;">
            <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);"></div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="confirmPassword">Confirm Master Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••••••" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; letter-spacing: 0.01em;">
          Create Vault Account 🔑
        </button>

      </form>

      <div style="text-align: center; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
        <p style="font-size: 0.88rem; color: #64748b;">Already have a vault?</p>
        <a href="/login" class="auth-footer-link" style="display: inline-block; margin-top: 6px; font-size: 0.92rem;">
          ← Return to Login
        </a>
      </div>
    </div>

    <!-- Security Footer -->
    <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <span>🔒</span> <span>Multi-Tenant Role-Based Access Control • Self-Hosted</span>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
