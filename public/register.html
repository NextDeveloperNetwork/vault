<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register - PassKeeper Vault</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <div class="app-container" style="justify-content: center; padding-bottom: 32px;">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-logo" style="width: 56px; height: 56px; margin: 0 auto 14px auto; font-size: 1.8rem;">🛡️</div>
      <h1 class="brand-title" style="font-size: 1.8rem;">Create Vault</h1>
      <p style="margin-top: 6px;">Setup your self-hosted master credentials</p>
    </div>

    <div class="glass-card" style="padding: 24px;">
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Your Name / Alias</label>
          <input type="text" id="name" class="form-input" placeholder="Alex" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Vault Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@passkeeper.local" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Master Password (min 8 chars)</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="new-password">
            <button type="button" class="input-icon-btn toggle-password-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
          <div style="height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 6px; overflow: hidden;">
            <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Master Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••••••" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
          Create Vault Account 🔑
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <p style="font-size: 0.85rem;">Already have a vault?</p>
        <a href="/login" style="color: var(--accent-primary); font-weight: 700; text-decoration: none; font-size: 0.9rem;">
          ← Return to Login
        </a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
